[package]
name = "openvxe"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Open-source configuration TUI for the VXE R1 SE+ wireless mouse"
license = "GPL-3.0-only"
repository = "https://github.com/BuSd777/OpenVXE"
readme = "README.md"
keywords = ["mouse", "hid", "tui", "vxe", "linux"]
categories = ["command-line-utilities", "hardware-support"]
default-run = "openvxe"

[dependencies]
crossterm = "0.29"
ratatui = "0.30"
hidapi = "2.4"
thiserror = "2"
anyhow = "1"
